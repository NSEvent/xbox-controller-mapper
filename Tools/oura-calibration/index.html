<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Oura Ring Calibration</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main id="stage">
		<div class="hud">
			<div class="title">Oura calibration</div>
			<div id="status" class="status">Ready</div>
		</div>
		<div class="controls">
			<button id="startButton" class="primary">Start</button>
			<button id="fullScreenButton">Fullscreen</button>
			<button id="exportButton" disabled>Export</button>
		</div>
		<div class="crosshair"></div>
		<div id="target" class="target rest"></div>
		<div class="label">
			<div id="direction" class="direction">Center</div>
			<div id="phase" class="phase">Point straight into the screen</div>
		</div>
		<div class="meter"><div id="meterFill"></div></div>
		<div id="countdown" class="countdown hidden">
			<div class="countdown-card">
				<div id="countdownNumber" class="countdown-number">3</div>
				<div id="countdownText" class="countdown-text">Get ready</div>
			</div>
		</div>
	</main>
	<script src="app.js"></script>
</body>
</html>
